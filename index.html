
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18B8B0">
  <title>BULZOVİK | İstediğin burada!</title>
  <style>
    :root {
      --turquoise: #18B8B0;
      --turquoise-dark: #118E89;
      --yellow: #FFD84D;
      --ink: #183D3A;
      --bg: #F5F8F7;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; }
    header {
      background: var(--turquoise);
      color: white;
      padding: 18px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }
    .tagline { font-size: 12px; margin-top: 4px; }
    .cart {
      background: var(--yellow);
      color: var(--ink);
      padding: 12px 15px;
      border-radius: 12px;
      font-weight: bold;
    }
    .hero {
      max-width: 1200px;
      margin: 18px auto;
      padding: 25px 5%;
      background: var(--turquoise);
      border-radius: 18px;
      color: white;
    }
    .hero h1 {
      font-size: clamp(27px, 5vw, 42px);
      margin: 0 0 10px;
    }
    .hero p { line-height: 1.6; }
    .offer {
      background: var(--yellow);
      color: var(--ink);
      padding: 14px;
      margin-top: 18px;
      border-radius: 13px;
      font-weight: bold;
    }
    .search {
      display: block;
      width: 90%;
      max-width: 700px;
      margin: 20px auto;
      padding: 15px;
      border: 2px solid #DCEDEA;
      border-radius: 13px;
      background: white;
      outline-color: var(--turquoise);
    }
    .categories {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 5px 5% 16px;
    }
    .category {
      background: white;
      color: var(--ink);
      border: 1px solid #DCEDEA;
      border-radius: 20px;
      padding: 10px 16px;
      white-space: nowrap;
    }
    .category.active {
      background: var(--turquoise);
      color: white;
      border-color: var(--turquoise);
    }
    main {
      max-width: 1200px;
      margin: auto;
      padding: 8px 5% 40px;
    }
    h2 { font-size: 23px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }
    .card {
      background: white;
      border-radius: 15px;
      padding: 10px;
      box-shadow: 0 3px 12px #183D3A0D;
      min-width: 0;
    }
    .photo {
      width: 100%;
      height: 145px;
      background: #E8F6F3;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 42px;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .name {
      font-weight: bold;
      margin: 12px 0 7px;
      overflow-wrap: anywhere;
    }
    .desc {
      font-size: 13px;
      color: #687B78;
      min-height: 32px;
      overflow-wrap: anywhere;
    }
    .price {
      color: var(--turquoise-dark);
      font-size: 20px;
      font-weight: 900;
      margin: 12px 0;
    }
    .add {
      width: 100%;
      background: var(--yellow);
      color: var(--ink);
      padding: 12px 5px;
      border-radius: 10px;
      font-weight: bold;
    }
    .empty {
      padding: 25px;
      text-align: center;
      color: #687B78;
      grid-column: 1 / -1;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 0;
      border-bottom: 1px solid #DCEDEA;
    }
    .qty button {
      background: #E5F6F3;
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: bold;
    }
    .total {
      text-align: right;
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
    }
    .checkout {
      width: 100%;
      background: var(--turquoise);
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-weight: bold;
    }
    .back {
      background: var(--yellow);
      color: var(--ink);
      padding: 12px 16px;
      border-radius: 10px;
    }
    footer {
      text-align: center;
      padding: 25px;
      background: var(--turquoise);
      color: white;
      font-size: 13px;
    }
    [hidden] { display: none !important; }
    @media (min-width: 650px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .photo { height: 210px; }
    }
    @media (min-width: 950px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="logo">BULZOVİK 🛍️</div>
      <div class="tagline">İstediğin burada!</div>
    </div>
    <button class="cart" id="cartButton">
      🛒 Sepet (<span id="count">0</span>)
    </button>
  </header>

  <section class="hero">
    <h1>Aradığın her şey burada! ✨</h1>
    <p>Keşfet, beğen, sepetine ekle. Alışverişin keyfini çıkar!</p>
    <div class="offer">💛 Fırsatları keşfet, favorilerini bul!</div>
  </section>

  <input id="search" class="search"
    placeholder="🔎 Ürün, marka veya kategori ara..."
    aria-label="Ürün ara">

  <nav class="categories" id="categories">
    <button class="category active" data-cat="Tümü">✨ Tümü</button>
    <button class="category" data-cat="Elektronik">🎧 Elektronik</button>
    <button class="category" data-cat="Giyim">👕 Giyim</button>
    <button class="category" data-cat="Ev">🏠 Ev & Yaşam</button>
    <button class="category" data-cat="Spor">⚽ Spor</button>
    <button class="category" data-cat="Diğer">🛍️ Diğer</button>
  </nav>

  <main>
    <section id="store">
      <h2>Öne çıkan ürünler ✨</h2>
      <div id="products" class="grid">
        <p class="empty">Ürünler yükleniyor...</p>
      </div>
    </section>

    <section id="cartView" hidden>
      <h2>Alışveriş sepetin 🛒</h2>
      <div id="cartItems"></div>
      <div class="total" id="total"></div>
      <button class="checkout" id="checkoutButton">
        Sipariş formuna geç
      </button>
      <p><button class="back" id="backButton">← Mağazaya dön</button></p>
    </section>
  </main>

  <footer>
    © <span id="year"></span> BULZOVİK · İstediğin burada!
  </footer>

  <script>
    const SUPABASE_URL =
      'https://nkczfvapwgmpmumfwses.supabase.co';
    const SUPABASE_KEY =
      'sb_publishable_YgTYxkXdPDTqnPnbPjMwJQ_5JULfgZL';

    let products = [];
    let cart = [];
    let selectedCategory = 'Tümü';
    let showingCart = false;

    const $ = id => document.getElementById(id);
    $('year').textContent = new Date().getFullYear();

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[c]);
    }

    async function loadProducts() {
      try {
        const response = await fetch(
          SUPABASE_URL +
          '/rest/v1/products?select=id,name,description,price,category,image_url,stock&is_active=eq.true&order=created_at.desc',
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: 'Bearer ' + SUPABASE_KEY
            }
          }
        );
        if (!response.ok) throw new Error('Ürünler alınamadı');
        products = await response.json();
        render();
      } catch (error) {
        $('products').innerHTML =
          '<p class="empty">Ürünler yüklenemedi. Bağlantıyı kontrol edip tekrar dene.</p>';
      }
    }

    function render() {
      if (showingCart) {
        renderCart();
        return;
      }

      const term = $('search').value.trim().toLocaleLowerCase('tr-TR');
      const filtered = products.filter(p => {
        const name = (p.name || '').toLocaleLowerCase('tr-TR');
        const category = (p.category || '').toLocaleLowerCase('tr-TR');
        const matchesSearch =
          name.includes(term) ||
          category.includes(term) ||
          (p.description || '').toLocaleLowerCase('tr-TR').includes(term);

        const selected = selectedCategory.toLocaleLowerCase('tr-TR');
        const matchesCategory = selectedCategory === 'Tümü' ||
          category === selected ||
          (selectedCategory === 'Ev' && category.includes('yaşam'));

        return matchesSearch && matchesCategory;
      });

      const area = $('products');

      if (!filtered.length) {
        area.innerHTML =
          '<p class="empty">Bu kategoride ürün bulunamadı.</p>';
        return;
      }

      area.innerHTML = filtered.map(p => {
        const image = p.image_url
          ? '<img src="' + escapeHtml(p.image_url) +
            '" alt="' + escapeHtml(p.name) +
            '" loading="lazy" onerror="this.parentElement.textContent=\'🛍️\'">'
          : '🛍️';

        return `
          <article class="card">
            <div class="photo">${image}</div>
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="desc">${escapeHtml(
              p.description || 'BULZOVİK’te seni bekliyor.'
            )}</div>
            <div class="price">${Number(p.price).toLocaleString('tr-TR')} TL</div>
            <button class="add" data-add="${escapeHtml(p.id)}">
              🛒 Sepete ekle
            </button>
          </article>`;
      }).join('');
    }

    function updateCount() {
      $('count').textContent =
        cart.reduce((sum, p) => sum + p.quantity, 0);
    }

    function addToCart(id) {
      const product = products.find(p => String(p.id) === String(id));
      if (!product) return;

      const stock = Number(product.stock);
      if (stock <= 0) {
        alert('Bu ürün şu anda stokta yok.');
        return;
      }

      const item = cart.find(p => String(p.id) === String(id));
      if (item) {
        if (item.quantity >= stock) {
          alert('Stok sınırına ulaştın.');
          return;
        }
        item.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      updateCount();
    }

    function renderCart() {
      const area = $('cartItems');

      if (!cart.length) {
        area.innerHTML = '<p class="empty">Sepetin henüz boş.</p>';
        $('total').textContent = '';
        return;
      }

      area.innerHTML = cart.map(p => `
        <div class="cart-item">
          <div>
            <strong>${escapeHtml(p.name)}</strong><br>
            ${(Number(p.price) * p.quantity).toLocaleString('tr-TR')} TL
          </div>
          <div class="qty">
            <button data-change="${escapeHtml(p.id)}" data-delta="-1">−</button>
            ${p.quantity}
            <button data-change="${escapeHtml(p.id)}" data-delta="1">+</button>
          </div>
        </div>
      `).join('');

      const total = cart.reduce(
        (sum, p) => sum + Number(p.price) * p.quantity, 0
      );
      $('total').textContent =
        'Toplam: ' + total.toLocaleString('tr-TR') + ' TL';
    }

    function changeQty(id, delta) {
      const item = cart.find(p => String(p.id) === String(id));
      if (!item) return;

      if (delta > 0 && item.quantity >= Number(item.stock)) {
        alert('Stok sınırına ulaştın.');
        return;
      }

      item.quantity += delta;
      cart = cart.filter(p => p.quantity > 0);
      updateCount();
      renderCart();
    }

    function toggleCart() {
      showingCart = !showingCart;
      $('store').hidden = showingCart;
      $('categories').hidden = showingCart;
      $('search').hidden = showingCart;
      $('cartView').hidden = !showingCart;
      document.querySelector('.hero').hidden = showingCart;

      $('cartButton').textContent = showingCart
        ? '← Mağaza'
        : '🛒 Sepet (' + cart.reduce((s, p) => s + p.quantity, 0) + ')';

      renderCart();
    }

    function checkout() {
      if (!cart.length) {
        alert('Önce sepetine ürün ekle.');
        return;
      }
      alert(
        'Sepetin hazır! Gerçek sipariş formu ve sipariş kaydı henüz kurulmadı. ' +
        'Şimdilik siparişin gönderilmez.'
      );
    }

    $('search').addEventListener('input', render);

    $('categories').addEventListener('click', event => {
      const button = event.target.closest('[data-cat]');
      if (!button) return;

      selectedCategory = button.dataset.cat;
      document.querySelectorAll('.category').forEach(b => {
        b.classList.toggle('active', b === button);
      });
      render();
    });

    $('products').addEventListener('click', event => {
      const button = event.target.closest('[data-add]');
      if (button) addToCart(button.dataset.add);
    });

    $('cartItems').addEventListener('click', event => {
      const button = event.target.closest('[data-change]');
      if (button) {
        changeQty(button.dataset.change, Number(button.dataset.delta));
      }
    });

    $('cartButton').addEventListener('click', toggleCart);
    $('backButton').addEventListener('click', toggleCart);
    $('checkoutButton').addEventListener('click', checkout);

    loadProducts();
  </script>
</body>
</html>
