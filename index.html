<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f27a1a">
  <title>BULZOVİK | İstediğin Burada!</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #f27a1a; /* Trendyol Turuncusu */
      --primary-dark: #d96813;
      --secondary: #333333;
      --bg: #f4f5f7;
      --white: #ffffff;
      --border: #e2e8f0;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: var(--secondary); }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; background: none; }

    /* Top Bar */
    .top-bar {
      background: #fafafa;
      font-size: 11px;
      color: #666;
      padding: 6px 5%;
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      border-bottom: 1px solid var(--border);
    }

    /* Header */
    header {
      background: var(--white);
      padding: 15px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-area { display: flex; flex-direction: column; }
    .logo { font-size: 26px; font-weight: 900; color: var(--primary); letter-spacing: 1px; }
    .tagline { font-size: 10px; color: #888; font-weight: 600; text-transform: uppercase; }

    /* Search Bar */
    .search-box {
      flex: 1;
      max-width: 600px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 12px 15px 12px 42px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f3f4f6;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }
    .search-box input:focus {
      background: var(--white);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(242, 122, 26, 0.15);
    }
    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
    }

    /* Cart Button */
    .cart-btn {
      background: var(--primary);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .cart-btn:hover { background: var(--primary-dark); }
    .cart-badge {
      background: white;
      color: var(--primary);
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 900;
    }

    /* Hero Banner */
    .hero {
      max-width: 1280px;
      margin: 20px auto;
      padding: 0 5%;
    }
    .hero-banner {
      background: linear-gradient(135deg, #f27a1a, #ff9f43);
      border-radius: 16px;
      color: white;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 10px 25px rgba(242, 122, 26, 0.2);
    }
    .hero-banner h1 { font-size: clamp(24px, 4vw, 36px); font-weight: 800; }
    .hero-banner p { font-size: 15px; opacity: 0.9; }

    /* Categories */
    .categories-container {
      max-width: 1280px;
      margin: 0 auto 20px;
      padding: 0 5%;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories-container::-webkit-scrollbar { display: none; }
    .cat-pill {
      background: var(--white);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-pill:hover, .cat-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(242, 122, 26, 0.2);
    }

    /* Main Container & Grid */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 5% 50px;
    }
    .section-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

    /* Product Card (Trendyol Style) */
    .card {
      background: var(--white);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
    }
    .card:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      transform: translateY(-3px);
    }
    .photo-wrapper {
      width: 100%;
      height: 180px;
      background: #f8fafc;
      position: relative;
      overflow: hidden;
    }
    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .card:hover .photo-wrapper img { transform: scale(1.05); }
    
    .card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; gap: 10px; }
    .product-name { font-size: 13px; font-weight: 600; color: #333; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-desc { font-size: 11px; color: #777; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    
    .price-box { display: flex; flex-direction: column; }
    .price { font-size: 16px; font-weight: 800; color: var(--primary); }

    /* Add to Cart Button & Ok Animasyonu */
    .add-btn {
      width: 100%;
      background: #fff3ec;
      color: var(--primary);
      border: 1px solid rgba(242, 122, 26, 0.3);
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .add-btn:hover {
      background: var(--primary);
      color: white;
    }
    .add-btn.success {
      background: var(--success) !important;
      color: white !important;
      border-color: var(--success) !important;
    }

    /* Sepet Ekranı */
    .cart-view {
      background: var(--white);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
    }
    .cart-controls { display: flex; align-items: center; gap: 10px; }
    .cart-controls button {
      background: #f3f4f6;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      font-weight: bold;
    }
    .checkout-box {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .checkout-btn {
      background: var(--primary);
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: bold;
    }
    .back-btn {
      background: #e2e8f0;
      color: #333;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
    }

    .empty-state { text-align: center; padding: 40px; color: #888; grid-column: 1 / -1; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="top-bar">
    <span>✨ Süper Fırsatlar</span>
    <span>📦 Hızlı Teslimat</span>
  </div>

  <!-- Header -->
  <header>
    <div class="logo-area" style="cursor: pointer;" onclick="goHome()">
      <div class="logo">BULZOVİK</div>
      <div class="tagline">İstediğin Burada!</div>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Aradığınız ürün, kategori veya markayı yazın...">
    </div>

    <button class="cart-btn" id="cartButton">
      <i class="fa-solid fa-cart-shopping"></i> Sepet
      <span class="cart-badge" id="count">0</span>
    </button>
  </header>

  <!-- Hero Section -->
  <section class="hero" id="heroSection">
    <div class="hero-banner">
      <h1>Sezonun En Büyük İndirimleri 🚀</h1>
      <p>Yüzlerce kategoride binlerce ürün seni bekliyor. Hemen keşfet!</p>
    </div>
  </section>

  <!-- Categories -->
  <div class="categories-container" id="categories">
    <button class="cat-pill active" data-cat="Tümü">✨ Tümü</button>
    <button class="cat-pill" data-cat="Elektronik">🎧 Elektronik</button>
    <button class="cat-pill" data-cat="Giyim">👕 Giyim</button>
    <button class="cat-pill" data-cat="Ev">🏠 Ev & Yaşam</button>
    <button class="cat-pill" data-cat="Spor">⚽ Spor</button>
    <button class="cat-pill" data-cat="Kozmetik">💄 Kozmetik</button>
    <button class="cat-pill" data-cat="Diğer">🛍️ Diğer</button>
  </div>

  <!-- Main Content -->
  <main>
    <!-- Store Products View -->
    <section id="storeView">
      <h2 class="section-title"><i class="fa-solid fa-bolt" style="color: var(--primary);"></i> Öne Çıkan Ürünler</h2>
      <div id="productsGrid" class="grid">
        <div class="empty-state">Ürünler Supabase'den yükleniyor...</div>
      </div>
    </section>

    <!-- Cart View -->
    <section id="cartView" hidden>
      <h2 class="section-title">Sepetim</h2>
      <div class="cart-view">
        <div id="cartItemsList"></div>
        <div class="checkout-box">
          <button class="back-btn" id="backButton">← Alışverişe Devam Et</button>
          <div style="font-size: 18px; font-weight: bold;" id="cartTotalText">Toplam: 0,00 TL</div>
          <button class="checkout-btn" onclick="alert('Sipariş modülü yakında aktif olacaktır!')">Siparişi Tamamla</button>
        </div>
      </div>
    </section>
  </main>

  <footer style="text-align: center; padding: 30px; background: white; border-top: 1px solid var(--border); margin-top: 40px; font-size: 12px; color: #777;">
    © 2026 BULZOVİK · Tüm hakları saklıdır.
  </footer>

  <!-- Script & Supabase Logic -->
  <script>
    // Supabase Bağlantı Bilgilerin
    const SUPABASE_URL = 'https://nkczfvapwgmpmumfwses.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_YgTYxkXdPDTqnPnbPjMwJQ_5JULfgZL';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let products = [];
    let cart = [];
    let selectedCategory = 'Tümü';
    let showingCart = false;

    const $ = id => document.getElementById(id);

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    // Ürünleri Supabase'den Çek
    async function loadProducts() {
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('id, name, description, price, category, image_url, stock');

        if (error) throw error;
        products = data || [];
        renderProducts();
      } catch (err) {
        console.error('Veri çekme hatası:', err);
        $('productsGrid').innerHTML = '<div class="empty-state">Ürünler yüklenemedi. Lütfen Supabase bağlantısını kontrol edin.</div>';
      }
    }

    // Ürünleri Ekrana Bas
    function renderProducts() {
      const term = $('searchInput').value.trim().toLocaleLowerCase('tr-TR');
      const filtered = products.filter(p => {
        const name = (p.name || '').toLocaleLowerCase('tr-TR');
        const cat = (p.category || '').toLocaleLowerCase('tr-TR');
        const desc = (p.description || '').toLocaleLowerCase('tr-TR');

        const matchesSearch = name.includes(term) || cat.includes(term) || desc.includes(term);
        const sel = selectedCategory.toLocaleLowerCase('tr-TR');
        const matchesCat = selectedCategory === 'Tümü' || cat.includes(sel) || (selectedCategory === 'Ev' && (cat.includes('yaşam') || cat.includes('ev')));

        return matchesSearch && matchesCat;
      });

      const grid = $('productsGrid');
      if (!filtered.length) {
        grid.innerHTML = '<div class="empty-state">Aradığınız kriterlere uygun ürün bulunamadı.</div>';
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const img = p.image_url ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.parentElement.textContent='🛍️'">` : '🛍️';
        const priceFormatted = Number(p.price || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2 });

        return `
          <article class="card">
            <div>
              <div class="photo-wrapper">${img}</div>
              <div class="card-body">
                <div>
                  <div class="product-name">${escapeHtml(p.name)}</div>
                  <div class="product-desc">${escapeHtml(p.description || 'BULZOVİK güvencesiyle.')}</div>
                </div>
              </div>
            </div>
            <div style="padding: 12px; border-top: 1px solid #f1f5f9;">
              <div class="price" style="margin-bottom: 8px;">${priceFormatted} TL</div>
              <button class="add-btn" id="btn-${p.id}" onclick="addToCart('${p.id}', this)">
                <i class="fa-solid fa-basket-shopping"></i> Sepete Ekle
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    // İstediğin Ok Animasyonlu ve Geri Bildirimli Sepete Ekleme Fonksiyonu
    function addToCart(id, btnElement) {
      const product = products.find(p => String(p.id) === String(id));
      if (!product) return;

      const stock = Number(product.stock ?? 100);
      const item = cart.find(p => String(p.id) === String(id));

      if (item) {
        if (item.quantity >= stock) {
          alert('Stok sınırına ulaştınız.');
          return;
        }
        item.quantity++;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      // Sepet sayacını güncelle
      updateCartCount();

      // Butonda "Eklendi ✓" ve ok işareti animasyonu tetikle
      const originalHTML = btnElement.innerHTML;
      btnElement.classList.add('success');
      btnElement.innerHTML = '<i class="fa-solid fa-circle-check"></i> Eklendi ✓';

      setTimeout(() => {
        btnElement.classList.remove('success');
        btnElement.innerHTML = originalHTML;
      }, 1500);
    }

    function updateCartCount() {
      const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      $('count').textContent = totalCount;
    }

    // Sepet Görünümü
    function renderCart() {
      const list = $('cartItemsList');
      if (!cart.length) {
        list.innerHTML = '<div class="empty-state">Sepetiniz henüz boş. Alışverişe hemen başlayın!</div>';
        $('cartTotalText').textContent = 'Toplam: 0,00 TL';
        return;
      }

      list.innerHTML = cart.map(p => `
        <div class="cart-item">
          <div>
            <strong>${escapeHtml(p.name)}</strong><br>
            <span style="color: var(--primary); font-weight: bold;">${(Number(p.price) * p.quantity).toLocaleString('tr-TR')} TL</span>
          </div>
          <div class="cart-controls">
            <button onclick="changeQty('${p.id}', -1)">-</button>
            <span>${p.quantity}</span>
            <button onclick="changeQty('${p.id}', 1)">+</button>
          </div>
        </div>
      `).join('');

      const total = cart.reduce((sum, p) => sum + (Number(p.price) * p.quantity), 0);
      $('cartTotalText').textContent = 'Toplam: ' + total.toLocaleString('tr-TR', { minimumFractionDigits: 2 }) + ' TL';
    }

    function changeQty(id, delta) {
      const item = cart.find(p => String(p.id) === String(id));
      if (!item) return;

      item.quantity += delta;
      cart = cart.filter(p => p.quantity > 0);
      updateCartCount();
      renderCart();
    }

    function toggleCartView() {
      showingCart = !showingCart;
      $('storeView').hidden = showingCart;
      $('categories').hidden = showingCart;
      $('searchInput').parentElement.hidden = showingCart;
      $('heroSection').hidden = showingCart;
      $('cartView').hidden = !showingCart;

      if (showingCart) {
        renderCart();
        $('cartButton').innerHTML = '<i class="fa-solid fa-store"></i> Mağaza';
      } else {
        $('cartButton').innerHTML = `<i class="fa-solid fa-cart-shopping"></i> Sepet <span class="cart-badge" id="count">${cart.reduce((s, p) => s + p.quantity, 0)}</span>`;
      }
    }

    function goHome() {
      if (showingCart) toggleCartView();
      $('searchInput').value = '';
      selectedCategory = 'Tümü';
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.toggle('active', b.dataset.cat === 'Tümü'));
      renderProducts();
    }

    // Olay Dinleyicileri
    $('searchInput').addEventListener('input', renderProducts);

    $('categories').addEventListener('click', e => {
      const btn = e.target.closest('[data-cat]');
      if (!btn) return;
      selectedCategory = btn.dataset.cat;
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.toggle('active', b === btn));
      renderProducts();
    });

    $('cartButton').addEventListener('click', toggleCartView);$('backButton').addEventListener('click', toggleCartView);

    // İlk Çalıştırma
    loadProducts();
  </script>
</body>
</html>
